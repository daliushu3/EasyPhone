<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI聊天应用</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .phone-container {
            width: 100%;
            max-width: 375px;
            height: 667px;
            background-color: #f5f5f5;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ============ 聊天列表页面 ============ */
        #chat-list-page {
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: #fff;
        }

        .list-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-header h2 {
            font-size: 20px;
        }

        .header-buttons {
            display: flex;
            gap: 15px;
        }

        .header-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .header-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            display: flex;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-item:hover {
            background-color: #f8f8f8;
        }

        .chat-item-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #667eea;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }

        .chat-item-content {
            flex: 1;
            margin-left: 12px;
            overflow: hidden;
        }

        .chat-item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .chat-item-name {
            font-weight: bold;
            font-size: 16px;
        }

        .chat-item-time {
            font-size: 12px;
            color: #999;
        }

        .chat-item-preview {
            font-size: 14px;
            color: #666;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ============ 聊天页面 ============ */
        #chat-page {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.3);
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-size: 16px;
            font-weight: bold;
        }

        .chat-status {
            font-size: 12px;
            opacity: 0.9;
        }

        .chat-header-actions {
            display: flex;
            gap: 15px;
        }

        .action-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background-color: #f5f5f5;
        }

        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: flex-start;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #667eea;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }

        .message-content {
            max-width: 70%;
            display: flex;
            flex-direction: column;
        }

        .message.user .message-content {
            align-items: flex-end;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-bottom: 5px;
        }

        .message-bubble {
            background-color: white;
            padding: 10px 15px;
            border-radius: 18px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message-thought {
            font-size: 12px;
            font-style: italic;
            color: #999;
            margin-top: 5px;
            padding-left: 10px;
            border-left: 2px solid #ddd;
        }

        /* 特殊消息类型 */
.message-delete-btn {
    position: absolute;
    top: 5px;
    right: 5px;
    background: rgba(255, 0, 0, 0.7);
    color: white;
    border: none;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    font-size: 12px;
    cursor: pointer;
    display: none;
    z-index: 10;
}

.message:hover .message-delete-btn {
    display: block;
}
        .message-image {
            max-width: 200px;
            border-radius: 10px;
            cursor: pointer;
        }

        .message-redpack {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            min-width: 200px;
        }

        .redpack-icon {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .redpack-text {
            font-size: 14px;
        }

        .redpack-amount {
            font-size: 20px;
            font-weight: bold;
            margin-top: 5px;
        }

        .redpack-claimed {
            background: #999;
        }

        /* 输入区域 */
        .chat-input-area {
            background-color: #f9f9f9;
            border-top: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .media-buttons-row {
            display: flex;
            gap: 5px;
            padding: 8px 15px 5px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .media-buttons-row::-webkit-scrollbar {
            display: none;
        }

        .media-btn-compact {
            background: white;
            border: 1px solid #ddd;
            color: #667eea;
            font-size: 18px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            flex-shrink: 0;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .media-btn-compact:hover {
            background-color: #f0f4ff;
            border-color: #667eea;
        }

        .media-btn-compact.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100());
            color: white;
            border-color: #667eea;
        }

        .input-row {
            padding: 5px 15px 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-btn {
            background: none;
            border: none;
            color: #667eea;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }

        .input-btn.active {
            color: #ff6b6b;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            background-color: white;
            border-radius: 20px;
            padding: 8px 15px;
            align-items: center;
            border: 1px solid #ddd;
        }

        .message-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            background: transparent;
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* ============ 设置页面 ============ */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .avatar-upload {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar-preview {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #667eea;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-success {
            background-color: #28a745;
            color: white;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        /* API设置 */
        .api-status {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .api-status.connected {
            background-color: #d4edda;
            color: #155724;
        }

        .api-status.disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }

        .model-item {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .model-item:hover {
            background-color: #f5f5f5;
        }

        .model-item.selected {
            border-color: #667eea;
            background-color: #f0f4ff;
        }

        /* Token计数 */
        .token-info {
            background-color: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .token-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .token-label {
            color: #666;
        }

        .token-value {
            font-weight: bold;
            color: #667eea;
        }

        /* 聊天背景选择 */
        .background-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .background-option {
            height: 80px;
            border-radius: 8px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: border-color 0.3s;
        }

        .background-option.selected {
            border-color: #667eea;
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 通知 */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 20px;
            z-index: 2000;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        /* 表情选择器 */
        .emoji-picker {
            position: absolute;
            bottom: 120px;
            left: 15px;
            right: 15px;
            max-height: 300px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.15);
            display: none;
            flex-direction: column;
            z-index: 100;
        }

        .emoji-picker.show {
            display: flex;
        }

        .emoji-picker-header {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .emoji-picker-header h3 {
            margin: 0;
            font-size: 16px;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
            gap: 5px;
            padding: 15px;
            overflow-y: auto;
            max-height: 200px;
        }

        .emoji-item {
            font-size: 28px;
            text-align: center;
            cursor: pointer;
            padding: 5px;
            border-radius: 8px;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .emoji-item:hover {
            background-color: #f0f4ff;
            transform: scale(1.2);
        }

        .emoji-picker-footer {
            padding: 10px 15px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.2);
            border-radius: 3px;
        }

        /* 响应式 */
        @media (max-width: 400px) {
            .phone-container {
                height: 600px;
            }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- 聊天列表页面 -->
        <div id="chat-list-page">
            <div class="list-header">
                <h2>聊天</h2>
                <div class="header-buttons">
                    <button class="header-btn" id="new-chat-btn" title="新建聊天">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button class="header-btn" id="settings-btn" title="设置">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>
            <div class="chat-list" id="chat-list">
                <!-- 聊天列表将在这里动态生成 -->
            </div>
        </div>

        <!-- 聊天页面 -->
        <div id="chat-page">
            <div class="chat-header">
                <div class="chat-header-left">
                    <button class="back-btn" id="back-btn">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="chat-avatar" id="chat-avatar"></div>
                    <div class="chat-info">
                        <div class="chat-name" id="chat-name">角色名称</div>
                        <div class="chat-status" id="chat-status">在线</div>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <button class="action-btn" id="chat-settings-btn" title="聊天设置">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <!-- 聊天消息将在这里动态生成 -->
            </div>

            <div class="chat-input-area">
                <!-- 媒体按钮行 -->
                <div class="media-buttons-row">
                    <button class="media-btn-compact" onclick="sendImage()" title="发送图片">
                        <i class="fas fa-image"></i>
                    </button>
                    <button class="media-btn-compact" id="emoji-btn" title="发送表情">
                        <i class="fas fa-smile"></i>
                    </button>
                    <button class="media-btn-compact" onclick="sendRedpack()" title="发送红包">
                        <i class="fas fa-gift"></i>
                    </button>
                    <button class="media-btn-compact" onclick="sendLocation()" title="发送定位">
                        <i class="fas fa-map-marker-alt"></i>
                    </button>
                    <button class="media-btn-compact" onclick="sendLink()" title="发送链接">
                        <i class="fas fa-link"></i>
                    </button>
                    <button class="media-btn-compact" onclick="sendVoice()" title="发送语音">
                        <i class="fas fa-microphone"></i>
                    </button>
                </div>
                
                <!-- 输入行 -->
                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="text" class="message-input" id="message-input" placeholder="输入消息...">
                    </div>
                    <button class="input-btn" id="new-topic-btn" title="开启新话题">
                        <i class="fas fa-heart"></i>
                    </button>
                    <button class="input-btn" id="send-message-btn" title="发送消息">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>

            <!-- 表情选择器 -->
            <div class="emoji-picker" id="emoji-picker">
                <div class="emoji-picker-header">
                    <h3>选择表情</h3>
                    <button class="modal-close" onclick="closeEmojiPicker()">×</button>
                </div>
                <div class="emoji-grid" id="emoji-grid">
                    <!-- 表情将在这里动态生成 -->
                </div>
                <div class="emoji-picker-footer">
                    <button class="btn btn-primary" onclick="addCustomEmoji()">
                        <i class="fas fa-plus"></i> 添加自定义表情
                    </button>
                </div>
            </div>
        </div>

        <!-- API设置模态框 -->
        <div class="modal" id="api-settings-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title">API设置</div>
                    <button class="modal-close" onclick="closeModal('api-settings-modal')">×</button>
                </div>
                
                <div class="api-status disconnected" id="api-status">
                    <i class="fas fa-circle"></i>
                    <span>未连接</span>
                </div>

                <div class="form-group">
                    <label class="form-label">API地址</label>
                    <input type="text" class="form-input" id="api-url" placeholder="http://localhost:11434 或代理URL">
                    <small style="color: #999; font-size: 12px;" id="url-hint">
                        提示：Ollama需要本地地址；Gemini/OpenAI可留空使用官方地址，或填入代理URL
                    </small>
                </div>

                <div class="form-group">
                    <label class="form-label">API类型</label>
                    <select class="form-select" id="api-type" onchange="updateApiHints()">
                        <option value="ollama">Ollama (本地)</option>
                        <option value="gemini">Google Gemini (需要API Key)</option>
                        <option value="openai">OpenAI兼容 (需要API Key)</option>
                        <option value="custom">自定义</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">API Key (Gemini等需要)</label>
                    <input type="password" class="form-input" id="api-key" placeholder="输入API Key，多个用逗号分隔">
                    <small style="color: #999; font-size: 12px;">提示：支持多个API Key轮换使用，用逗号分隔</small>
                </div>

                <div class="form-group">
                    <label class="form-label">温度参数 (Temperature)</label>
                    <input type="number" class="form-input" id="api-temperature" placeholder="0.0-2.0" min="0" max="2" step="0.1" value="0.8">
                    <small style="color: #999; font-size: 12px;">较高的值(如0.8)会使输出更随机，较低的值(如0.2)会使其更集中和确定</small>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" id="test-connection-btn">测试连接</button>
                    <button class="btn btn-success" id="fetch-models-btn">拉取模型列表</button>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label class="form-label">选择模型</label>
                    <div id="models-list">

    <script>
        // ============ 全局数据 ============
        let appData = {
            apiSettings: {

        // 全局状态管理
        let state = {
            globalSettings: {
                apiTemperature: 0.8  // 默认温度参数
            },
            emojis: [
                // 默认表情包
                { text: '😊', meaning: '开心、微笑' },
                { text: '😂', meaning: '哈哈大笑、非常开心' },
                { text: '😭', meaning: '哭泣、难过' },
                { text: '😍', meaning: '喜欢、爱心满满' },
                { text: '🤔', meaning: '思考、疑惑' },
                { text: '😤', meaning: '生气、愤怒' },
                { text: '🥺', meaning: '可怜、委屈' },
                { text: '👍', meaning: '点赞、好的' },
                { text: '👎', meaning: '不喜欢、差评' },
                { text: '🙏', meaning: '祈祷、拜托' },
                { text: '💔', meaning: '心碎、失恋' },
                { text: '❤️', meaning: '爱心、喜欢' },
                { text: '😱', meaning: '震惊、恐怖' },
                { text: '🤗', meaning: '拥抱、温暖' },
                { text: '😏', meaning: '得意、坏笑' }
            ]
        };

        // ============ 辅助函数 ============
        // 从API Key数组中随机选择一个
        function getRandomValue(value) {
            if (!value) return '';
            if (typeof value === 'string') {
                // 检查是否包含逗号分隔的多个key
                if (value.includes(',')) {
                    const keys = value.split(',').map(k => k.trim()).filter(k => k);
                    if (keys.length > 0) {
                        return keys[Math.floor(Math.random() * keys.length)];
                    }
                }
                return value;
            }
            if (Array.isArray(value) && value.length > 0) {
                return value[Math.floor(Math.random() * value.length)];
            }
            return '';
        }

        // ============ Gemini API处理 ============
        // 构造Gemini请求数据
        function toGeminiRequestData(baseUrl, model, apiKey, systemInstruction, messagesForDecision) {
            const apiTemperature = state.globalSettings.apiTemperature || 0.8; 
            const roleType = {
                user: 'user',
                assistant: 'model',
                system: 'user'
            };
         
            const contents = [
                {
                    role: 'user',
                    parts: [{ text: systemInstruction }]
                },
                {
                    role: 'model',
                    parts: [{ text: '好的，我明白了。我会严格遵守以上所有规则和设定。' }]
                },
                ...messagesForDecision.map((item) => {
                    const parts = [];
                    
                    if (Array.isArray(item.content)) {
                        item.content.forEach(part => {
                            if (part.type === 'text') {
                                parts.push({ text: part.text });
                            } else if (part.type === 'image_url' && part.image_url && part.image_url.url) {
                                // 处理图片
                                const currentImageData = part.image_url.url;
                                const base64Data = currentImageData.split(',')[1];
                                const mimeTypeMatch = currentImageData.match(/^data:(.*);base64/);
                                if (mimeTypeMatch && base64Data) {
                                    parts.push({
                                        inline_data: {
                                            mime_type: mimeTypeMatch[1],
                                            data: base64Data
                                        }
                                    });
                                }
                            }
                        });
                    } else {
                        // 普通文本消息
                        parts.push({ text: String(item.content) });
                    }
                    return { role: roleType[item.role], parts: parts };
                })
            ];
            
            // 使用配置的baseUrl而非硬编码
            return {
                url: `${baseUrl}/v1beta/${model}:generateContent?key=${getRandomValue(apiKey)}`,
                data: {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: contents,
                        generationConfig: {
                            temperature: apiTemperature, 
                        },
                    })
                }
            };
        }

        // 解析Gemini响应
        function getGeminiResponseText(data) {
            // 首先尝试解析OpenAI兼容格式（某些Gemini API可能返回这种格式）
            if (data.choices && Array.isArray(data.choices) && data.choices.length > 0 && data.choices[0].message && data.choices[0].message.content) {
                return data.choices[0].message.content;
            }
        
            // 解析标准Gemini格式
            if (data.candidates && Array.isArray(data.candidates) && data.candidates.length > 0 && data.candidates[0].content && data.candidates[0].content.parts) {
                return data.candidates[0].content.parts[0].text;
            }
        
            // 如果没有找到内容，进行详细的错误分析
            console.error("Gemini API返回了非预期的格式:", data);
            let errorReason = "AI返回了空内容或未知格式。";
        
            // 检查是否因安全策略被屏蔽（回复内容被屏蔽）
            if (data.candidates && Array.isArray(data.candidates) && data.candidates.length > 0 && data.candidates[0].finishReason === 'SAFETY') {
                const safetyRatings = data.candidates[0].safetyRatings;
                const blockedCategories = safetyRatings
                    .filter(r => r.probability !== 'NEGLIGIBLE' && r.probability !== 'LOW')
                    .map(r => `${r.category} (概率: ${r.probability})`)
                    .join(', ');
                errorReason = `内容因安全策略被屏蔽。触发类别: ${blockedCategories || '未知'}`;
            }
            // 检查提示词是否被屏蔽
            else if (data.promptFeedback?.blockReason) {
                const reason = data.promptFeedback.blockReason;
                const details = data.promptFeedback.safetyRatings?.map(r => `${r.category}: ${r.probability}`).join(', ');
                errorReason = `内容因安全策略被屏蔽 (原因: ${reason})。详情: ${details || '无'}`;
            } 
            // 检查API错误
            else if (data.error) {
                errorReason = `API错误: ${data.error.message}`;
            }
            
            // 抛出错误
            throw new Error(errorReason);
        }

        // ============ 初始化 ============

        function loadData() {

        // ============ 事件绑定 ============
        function bindEvents() {

            document.getElementById('new-chat-btn').addEventListener('click', () => {

            const emojiBtn = document.getElementById('emoji-btn');

            // 测试连接
            document.getElementById('test-connection-btn').addEventListener('click', testConnection);

            document.getElementById('fetch-models-btn').addEventListener('click', fetchModels);

            // 背景选择
            document.querySelectorAll('.background-option').forEach(option => {
                option.addEventListener('click', function() {

            // 头像预览
            document.getElementById('char-avatar').addEventListener('input', function() {
                const preview = document.getElementById('char-avatar-preview');

        // ============ 聊天列表 ============
        function renderChatList() {
            const chatList = document.getElementById('chat-list');
            chatList.innerHTML = '';

            if (appData.chats.length === 0) {
                chatList.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">暂无聊天，点击+创建新聊天</p>';

                chatItem.className = 'chat-item';
                chatItem.onclick = () => openChat(chat.id);

                const avatar = document.createElement('div');
                avatar.className = 'chat-item-avatar';
                if (chat.character.avatar) {
                    avatar.style.backgroundImage = `url(${chat.character.avatar})`;
                } else {
                    avatar.textContent = chat.name.charAt(0);
                }

                const content = document.createElement('div');
                content.className = 'chat-item-content';

                const lastMessage = chat.messages.length > 0 
                    ? chat.messages[chat.messages.length - 1].content.substring(0, 30) + '...'
                    : '暂无消息';

                content.innerHTML = `
                    <div class="chat-item-top">

                        <div class="chat-item-time">${new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'})}</div>
                    </div>
                    <div class="chat-item-preview">${lastMessage}</div>

                chatItem.appendChild(avatar);
                chatItem.appendChild(content);
                chatList.appendChild(chatItem);
            });

        // ============ 打开聊天 ============
        function openChat(chatId) {
            appData.currentChatId = chatId;

            if (!chat) return;

            // 更新界面
            document.getElementById('chat-name').textContent = chat.name;
            document.getElementById('chat-status').textContent = chat.character.setting ? '在线 · ' + chat.character.setting.substring(0, 10) : '在线';

       // ============ 渲染消息 ============
function renderMessages() {
    const chat = getCurrentChat();
    if (!chat) return;

    const messagesContainer = document.getElementById('chat-messages');
    messagesContainer.innerHTML = '';

    chat.messages.forEach(msg => {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${msg.sender}`;
        messageDiv.style.position = 'relative'; // 为删除按钮定位

        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        
        if (msg.sender === 'user') {
            if (chat.user.avatar) {
                avatar.style.backgroundImage = `url(${chat.user.avatar})`;
            } else {
                avatar.textContent = chat.user.nickname.charAt(0);
            }
        } else {
            if (chat.character.avatar) {
                avatar.style.backgroundImage = `url(${chat.character.avatar})`;
            } else {
                avatar.textContent = chat.character.nickname.charAt(0);
            }
        }

        const content = document.createElement('div');
        content.className = 'message-content';

        const time = document.createElement('div');
        time.className = 'message-time';
        time.textContent = msg.time;

        content.appendChild(time);

       // 处理不同类型的消息
if (msg.type === 'text') {
    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';
    
    // 处理多行消息
    const lines = msg.content.split('\n');
    bubble.innerHTML = lines.map(line => line || '&nbsp;').join('<br>');
    content.appendChild(bubble);

    if (msg.thought) {
        const thought = document.createElement('div');
        thought.className = 'message-thought';
        thought.textContent = msg.thought;
        content.appendChild(thought);
    }
} else if (msg.type === 'retry') {
    // 重试按钮样式
    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';
    bubble.style.backgroundColor = '#ff6b6b';
    bubble.style.color = 'white';
    bubble.style.cursor = 'pointer';
    bubble.style.textAlign = 'center';
    bubble.innerHTML = `
        <i class="fas fa-exclamation-triangle"></i> ${msg.content}<br>
        <small style="margin-top: 5px; display: block;">
            <i class="fas fa-redo"></i> 点击重新发送
        </small>
    `;
    
    bubble.onclick = () => {
        // 移除错误消息
        chat.messages = chat.messages.filter(m => m.id !== msg.id);
        saveData();
        renderMessages();
        // 重新调用AI
        callAI(msg.isNewTopic || false);
    };
    
    content.appendChild(bubble);


        } else if (msg.type === 'image') {
            const img = document.createElement('img');
            img.className = 'message-image';
            img.src = msg.content;
            img.alt = msg.description || '图片';
            content.appendChild(img);
        } else if (msg.type === 'redpack') {
            const redpack = document.createElement('div');
            redpack.className = 'message-redpack' + (msg.claimed ? ' redpack-claimed' : '');

async function callAI(isNewTopic) {
    const chat = getCurrentChat();
    if (!chat) return;

    if (!appData.apiSettings.selectedModel) {
        showNotification('请先在设置中选择AI模型');
        return;
    }

    // 显示加载状态
    const loadingMsg = {
        id: 'loading',
        sender: 'ai',
        type: 'text',
        content: '正在思考...',
        time: new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'})
    };

        } else if (apiType === 'openai') {

        }

        // 移除加载消息

        // 清理AI响应中的思考内容
        aiResponse = cleanAIResponse(aiResponse);

        // 解析AI响应
        parseAIResponse(chat, aiResponse);
        saveData();
        renderMessages();

    } catch (error) {
        // 移除加载消息
        chat.messages = chat.messages.filter(m => m.id !== 'loading');
        
        // 添加错误提示和重试按钮

        };
        chat.messages.push(errorMsg);
        saveData();
        renderMessages();
        
        showNotification('AI调用失败: ' + error.message);
        console.error(error);
    }
}

    const systemInstruction = buildSystemInstruction(chat);
    
    // 构建消息历史

        content: systemInstruction
    });

    const requestBody = {
        model: appData.apiSettings.selectedModel,
        messages: messages,
        temperature: state.globalSettings.apiTemperature || 0.8
    };

    console.log('调用OpenAI兼容API:', baseUrl + '/v1/chat/completions');
    console.log('请求模型:', appData.apiSettings.selectedModel);

    try {
        const response = await fetch(`${baseUrl}/v1/chat/completions`, {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${getRandomValue(appData.apiSettings.key)}`
            },
            body: JSON.stringify(requestBody)
        });

        // 先检查响应类型
        const contentType = response.headers.get('content-type');
        console.log('响应Content-Type:', contentType);
        
        if (!response.ok) {
            let errorMessage;
            
            // 如果是JSON错误
            if (contentType && contentType.includes('application/json')) {
                const errorData = await response.json();
                errorMessage = errorData.error?.message || JSON.stringify(errorData);
            } 
            // 如果是HTML错误页面
            else if (contentType && contentType.includes('text/html')) {
                const htmlText = await response.text();
                console.error('收到HTML响应:', htmlText.substring(0, 500));
                errorMessage = `API返回了网页而不是JSON数据。请检查：
1. API地址是否正确 (当前: ${baseUrl})
2. API Key是否有效
3. 是否需要配置代理或VPN`;
            } 
            // 其他类型错误
            else {
                const errorText = await response.text();
                console.error('收到非JSON响应:', errorText.substring(0, 500));
                errorMessage = `API返回了意外的响应格式: ${contentType || '未知'}`;
            }
            
            throw new Error(`OpenAI API错误 (${response.status}): ${errorMessage}`);
        }

        // 检查成功响应的类型
        if (!contentType || !contentType.includes('application/json')) {
            const text = await response.text();
            console.error('成功响应但不是JSON:', text.substring(0, 500));
            throw new Error('API返回的不是JSON格式的数据。请检查API地址和配置是否正确。');
        }

        const data = await response.json();
        
        // 解析OpenAI响应
        if (data.choices && data.choices.length > 0 && data.choices[0].message) {
            return data.choices[0].message.content || '';
        }
        
        throw new Error('OpenAI API返回了无效的响应格式');
        
    } catch (error) {
        // 如果是网络错误
        if (error.message.includes('Failed to fetch')) {
            throw new Error('网络连接失败。请检查：\n1. API地址是否可访问\n2. 网络连接是否正常\n3. 是否需要代理');
        }
        // 如果是JSON解析错误
        else if (error instanceof SyntaxError) {
            throw new Error('API返回的不是有效的JSON数据。请检查API地址是否正确配置。');
        }
        // 其他错误直接抛出
        throw error;
    }
}

// ============ 清理AI响应 ============
function cleanAIResponse(response) {
    if (!response) return '';
    
    let cleaned = response;
    
    // 1. 移除XML风格的思考标签
    cleaned = cleaned.replace(/<think>[\s\S]*?<\/think>/gi, '');
    cleaned = cleaned.replace(/<thinking>[\s\S]*?<\/thinking>/gi, '');
    cleaned = cleaned.replace(/<thought>[\s\S]*?<\/thought>/gi, '');
    
    // 2. 移除中文方括号标记
    cleaned = cleaned.replace(/\[思考\][\s\S]*?\[\/思考\]/g, '');
    cleaned = cleaned.replace(/\[思维\][\s\S]*?\[\/思维\]/g, '');
    cleaned = cleaned.replace(/\[分析\][\s\S]*?\[\/分析\]/g, '');
    cleaned = cleaned.replace(/\[内心\][\s\S]*?\[\/内心\]/g, '');
    cleaned = cleaned.replace(/\[推理\][\s\S]*?\[\/推理\]/g, '');
    
    // 3. 移除中文书名号标记
    cleaned = cleaned.replace(/【思考】[\s\S]*?【\/思考】/g, '');
    cleaned = cleaned.replace(/【思维链】[\s\S]*?【\/思维链】/g, '');
    cleaned = cleaned.replace(/【分析】[\s\S]*?【\/分析】/g, '');
    cleaned = cleaned.replace(/【推理】[\s\S]*?【\/推理】/g, '');
    
    // 4. 移除英文括号标记
    cleaned = cleaned.replace(/\(thinking:[\s\S]*?\)/gi, '');
    cleaned = cleaned.replace(/\(thought:[\s\S]*?\)/gi, '');
    cleaned = cleaned.replace(/\(analysis:[\s\S]*?\)/gi, '');
    
    // 5. 移除常见的思考前缀行
    cleaned = cleaned.replace(/^思考过程[：:].*/gm, '');
    cleaned = cleaned.replace(/^让我想想[：:].*/gm, '');
    cleaned = cleaned.replace(/^分析[：:].*/gm, '');
    cleaned = cleaned.replace(/^推理[：:].*/gm, '');
    cleaned = cleaned.replace(/^内心独白[：:].*/gm, '');
    
    // 6. 移除markdown代码块中的思考内容
    cleaned = cleaned.replace(/```thinking[\s\S]*?```/gi, '');
    cleaned = cleaned.replace(/```thought[\s\S]*?```/gi, '');
    cleaned = cleaned.replace(/```analysis[\s\S]*?```/gi, '');
    
    // 7. 移除以"思考:"、"分析:"等开头的整段内容(直到遇到换行)
    cleaned = cleaned.replace(/^思考[:：].+$/gm, '');
    cleaned = cleaned.replace(/^分析[:：].+$/gm, '');
    cleaned = cleaned.replace(/^推理[:：].+$/gm, '');
    
    // 8. 移除聊天记录标签
    cleaned = cleaned.replace(/<聊天记录>[\s\S]*?<\/聊天记录>/g, '');
    
    // 9. 移除特殊格式标记
    cleaned = cleaned.replace(/###.*/g, '');  // 移除###开头的行
    cleaned = cleaned.replace(/\|[^|]+\|/g, '');  // 移除|name|格式
    cleaned = cleaned.replace(/\([^)]*\d{1,2}:\d{2}[^)]*\)/g, '');  // 移除时间标记
    
    // 10. 清理多余的空行(保留最多1个连续空行)
    cleaned = cleaned.replace(/\n{3,}/g, '\n\n');
    
    // 11. 清理首尾空白
    cleaned = cleaned.trim();
    
    // 12. 如果清理后内容为空,返回原始内容(防止过度清理)
    if (!cleaned || cleaned.length < 2) {
        return response.trim();
    }
    
    return cleaned;
}

// ============ 解析AI响应 ============
function parseAIResponse(chat, response) {
    // 提取心情
    const moodMatch = response.match(/###(.+)/);
    let mood = '';
    if (moodMatch) {
        mood = moodMatch[1].trim();
    }

    // 提取消息
    const messagePattern = /(?:\|([^|]+)\|)?\s*\(([^)]+)\)\s*([^\[]+)(?:\[([^\]]*)\])?/g;
    let match;
    let hasMessages = false;
    let allMessages = []; // 收集所有要发送的消息

    while ((match = messagePattern.exec(response)) !== null) {
        const name = match[1];
        const time = match[2];
        const content = match[3].trim();
        const thought = match[4];

        // 跳过标题行
        if (content.includes('标题：') || content.includes('###')) continue;

        // 处理多条消息（用回车分隔）
        const messages = content.split('\n').filter(m => m.trim());
        
        messages.forEach(msgContent => {
            allMessages.push({
                content: msgContent.trim(),
                time: time,
                thought: thought && thought.trim() ? thought.trim() : null,
                mood: mood
            });
            hasMessages = true;
        });
    }

    // 如果没有解析到消息，尝试直接拆分回复
    if (!hasMessages) {
        // 清理响应内容
        let cleanResponse = response
            .replace(/<聊天记录>[\s\S]*?<\/聊天记录>/g, '')
            .replace(/###.+/g, '')
            .replace(/\(.+?\)/g, '')
            .replace(/\[.+?\]/g, '')
            .trim();

        // 按标点符号拆分成短句
        const sentences = splitIntoSentences(cleanResponse);
        
        sentences.forEach(sentence => {
            if (sentence.trim()) {
                allMessages.push({
                    content: sentence.trim(),
                    time: new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}),
                    thought: null,
                    mood: ''
                });
            }
        });
    }

    // 如果还是没有消息，添加原始响应
    if (allMessages.length === 0) {
        allMessages.push({
            content: response,
            time: new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}),
            thought: null,
            mood: ''
        });
    }

    // 依次发送消息（模拟打字间隔）
    sendMessagesWithDelay(chat, allMessages);
}

// 拆分成短句的辅助函数
function splitIntoSentences(text) {
    // 按照中文和英文的常见标点符号拆分
    const sentences = [];
    let current = '';
    
    for (let i = 0; i < text.length; i++) {
        const char = text[i];
        current += char;
        
        // 遇到句子结束符号
        if (/[。！？.!?;；]/.test(char)) {
            // 检查是否是省略号的一部分
            if (char === '.' && i < text.length - 1 && text[i + 1] === '.') {
                continue;
            }
            
            // 检查后面是否有引号或括号需要包含
            let j = i + 1;
            while (j < text.length && /["'」』）)]/.test(text[j])) {
                current += text[j];
                j++;
                i++;
            }
            
            const trimmed = current.trim();
            if (trimmed && trimmed.length > 0) {
                sentences.push(trimmed);
            }
            current = '';
        }
        // 如果当前句子太长（超过30字符），在逗号处拆分
        else if (current.length > 30 && /[，,、]/.test(char)) {
            const trimmed = current.trim();
            if (trimmed && trimmed.length > 0) {
                sentences.push(trimmed);
            }
            current = '';
        }
    }
    
    // 添加剩余内容
    if (current.trim()) {
        sentences.push(current.trim());
    }
    
    return sentences;
}

// 带延迟发送消息
function sendMessagesWithDelay(chat, messages, index = 0) {
    if (index >= messages.length) {
        return;
    }

    const msgData = messages[index];
    const aiMessage = {
        id: Date.now().toString() + '_' + index,
        sender: 'ai',
        type: 'text',
        content: msgData.content,
        time: msgData.time,
        thought: msgData.thought,
        mood: msgData.mood
    };

    chat.messages.push(aiMessage);
    saveData();
    renderMessages();

    // 计算延迟时间（根据消息长度，模拟打字速度）
    // 基础延迟300ms + 每个字符20ms
    const baseDelay = 300;
    const charDelay = 20;
    const delay = baseDelay + (msgData.content.length * charDelay);
    
    // 最小500ms，最大3000ms
    const finalDelay = Math.max(500, Math.min(delay, 3000));

    // 发送下一条消息
    setTimeout(() => {
        sendMessagesWithDelay(chat, messages, index + 1);
    }, finalDelay);
}

        // ============ Token计数 ============
        function updateTokenCount() {
            const chat = getCurrentChat();
            if (!chat) return;

            // 简单的token估算（中文约1个字=1.5 tokens，英文约1个词=1 token）
            function estimateTokens(text) {
                if (!text) return 0;
                const chinese = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
                const english = (text.match(/[a-zA-Z]+/g) || []).length;
                return Math.ceil(chinese * 1.5 + english);
            }

            // 提示词token
            const promptBase = 500; // 基础提示词约500 tokens
            
            // 人物设定token
            const settingTokens = estimateTokens(chat.character.setting) + 
                                 estimateTokens(chat.user.setting) + 
                                 estimateTokens(chat.character.nickname) +
                                 estimateTokens(chat.user.nickname);

            // 历史对话token
            let historyTokens = 0;
            chat.messages.forEach(msg => {
                if (msg.type === 'text') {
                    historyTokens += estimateTokens(msg.content);
                }
            });

            // 归档token
            let archiveTokens = 0;
            if (chat.archives) {
                chat.archives.forEach(archive => {
                    archiveTokens += estimateTokens(archive);
                });
            }
            historyTokens += archiveTokens;

            const totalTokens = promptBase + settingTokens + historyTokens;

            document.getElementById('token-prompt').textContent = promptBase;
            document.getElementById('token-setting').textContent = settingTokens;
            document.getElementById('token-history').textContent = historyTokens;
            document.getElementById('token-total').textContent = totalTokens;
        }

                reader.onload = event => {
                    try {
                        const chat = JSON.parse(event.target.result);

        }

            if (!confirm('确定要清空当前聊天记录吗？此操作不可恢复！')) return;

            const chat = getCurrentChat();
            if (!chat) return;

            chat.messages = [];
            chat.archives = [];
            saveData();
            renderMessages();
            showNotification('聊天记录已清空');
        }

        // ============ 媒体消息 ============
        function sendImage() {
            const url = prompt('请输入图片URL:');
            if (!url) return;

            const description = prompt('请输入图片描述（可选）:');

            const chat = getCurrentChat();
            if (!chat) return;

            const imageMsg = {
                id: Date.now().toString(),
                sender: 'user',
                type: 'image',
                content: url,
                description: description,
                time: new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'})
            };

            chat.messages.push(imageMsg);
            saveData();
            renderMessages();
            closeModal('media-modal');
            showNotification('图片已发送');
        }

        function sendEmoji() {
            const emoji = prompt('请输入表情包URL或emoji:');
            if (!emoji) return;

            const chat = getCurrentChat();

            const emojiMsg = {
                id: Date.now().toString(),
                sender: 'user',
                type: 'text',
                content: emoji,
                time: new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'})
            };

            chat.messages.push(emojiMsg);
            saveData();
            renderMessages();
            closeModal('media-modal');
        }

function deleteMessage(messageId) {
    const chat = getCurrentChat();
    if (!chat) return;
    
    if (confirm('确定要删除这条消息吗？')) {
        chat.messages = chat.messages.filter(m => m.id !== messageId);
        saveData();
        renderMessages();
        showNotification('消息已删除');
    }
}

        function sendRedpack() {

            const chat = getCurrentChat();
            if (!chat) return;

            const msg = chat.messages.find(m => m.id === msgId);
            if (msg) {
                msg.claimed = true;
                saveData();
                renderMessages();
                showNotification('红包已领取！');
            }
        }

        // ============ 表情选择器 ============
        function closeEmojiPicker() {
    document.getElementById('emoji-picker').classList.remove('show');
}

function renderEmojis() {
    const emojiGrid = document.getElementById('emoji-grid');
    emojiGrid.innerHTML = '';
    
    state.emojis.forEach((emoji, index) => {
        const emojiItem = document.createElement('div');
        emojiItem.className = 'emoji-item';
        emojiItem.textContent = emoji.text;
        emojiItem.title = emoji.meaning;
        emojiItem.onclick = () => insertEmoji(emoji.text);
        emojiGrid.appendChild(emojiItem);
    });
}

function insertEmoji(emojiText) {
    const input = document.getElementById('message-input');
    input.value += emojiText;
    input.focus();
    closeEmojiPicker();
}

function addCustomEmoji() {
    const text = prompt('请输入表情（emoji或表情包URL）:');
    if (!text) return;
    
    const meaning = prompt('请输入表情含义（AI也会使用这个含义）:');
    if (!meaning) return;
    
    state.emojis.push({ text, meaning });
    localStorage.setItem('customEmojis', JSON.stringify(state.emojis));
    renderEmojis();
    showNotification('表情已添加！');
}

// 加载自定义表情
function loadCustomEmojis() {
    const saved = localStorage.getItem('customEmojis');
    if (saved) {
        state.emojis = JSON.parse(saved);
    }
}

// 在初始化时加载
loadCustomEmojis();

        // ============ 工具函数 ============
        function getCurrentChat() {
            return appData.chats.find(c => c.id === appData.currentChatId);
        }

        function showModal(modalId) {
            document.getElementById(modalId).classList.add('show');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // ============ 启动应用 ============
        window.addEventListener('DOMContentLoaded', init);
    </script>
